[project]
name = "nyc-yellow-taxi-trip"
version = "0.1.0"
description = "This project aim is to identify busy hours and zones, and summarize trip duration, distance and fares using data from the official NYC TLC data page."
readme = "README.md"
authors = [
    { name = "Nikoletta", email = "nikolettanod@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.2.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.scripts]
nyc-yellow-taxi-trip = "nyc_yellow_taxi_trip.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # basic python errors and structural style problems
    "E7",
    "E9",
    "F",  # unused imports/undrfined var/similar correctness issues
    "I",  # import ordering
    "UP",  # outdated python syntax -> modernize
    "B",  # common bug-prone patterns
    "C4",  # unnecessary or inefficient collection construction
    "RET",  # confusing or unnecessary return statements
    "SIM",  # unnecessarily complicated expressions
    "PERF",  # straightforward performance mistakes
    "RUF",  # Ruff-specific correctness checks
]

[tool.pyright]
include = ["src", "main.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
